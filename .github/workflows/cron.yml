# Run one of the scheduled jobs by hand.
#
# The jobs themselves are scheduled in vercel.json: the daily and weekly ones
# always, and the every-few-minutes ones — live scores, mail and the draft
# clock — once the league sets FREQUENT_JOBS=on in the Vercel environment (see
# src/lib/frequent-jobs.ts for what turning them on changes).
#
# They used to be scheduled here, and never ran. Every one of the 292
# scheduled runs between August 30 and September 29 stopped at its first line
# for want of a SITE_URL secret, and GitHub only ran the "every five minutes"
# schedule about ten times a day besides. Vercel's scheduler already runs this
# project's push job every ten minutes to the minute, so that is where they
# went.
#
# What is left is a button, for testing and for pushing a job through by hand:
#
#   Actions -> Run a job -> Run workflow
#
# It needs one repository secret (Settings -> Secrets and variables ->
# Actions): CRON_SECRET, the same value as the Vercel environment variable.
# SITE_URL is optional and defaults to the production domain. If it is set it
# must be the custom domain: the *.vercel.app addresses sit behind Vercel's
# login and answer 401.

name: Run a job

on:
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run now
        required: true
        default: scores
        type: choice
        options: [scores, autodraft, waivers, mail, push, health, draft-picks, projections]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call the endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL || 'https://pylonn.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          JOB: ${{ github.event.inputs.job }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the CRON_SECRET repository secret to the value in the Vercel environment."
            exit 1
          fi

          echo "--- $JOB at $SITE_URL"
          CODE=$(curl -sS -o /tmp/out.json -w '%{http_code}' --max-time 70 \
            -H "authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/$JOB") || CODE=000
          echo "HTTP $CODE"
          cat /tmp/out.json 2>/dev/null || true
          echo

          # Anything but a 2xx is a failure. This used to fail only on a 5xx,
          # so a 401 from a wrong secret or a 404 from a wrong address would
          # have been reported as the job running.
          case "$CODE" in
            2*) exit 0 ;;
            401) echo "::error::The site refused the secret. CRON_SECRET here must match the Vercel environment." ;;
            404) echo "::error::There is no such job at $SITE_URL. Check SITE_URL." ;;
            000) echo "::error::Could not reach $SITE_URL." ;;
            *) echo "::error::The job answered HTTP $CODE." ;;
          esac
          exit 1
