# The frequent jobs.
#
# Vercel's Hobby plan allows two cron jobs, each at most once a day, so
# vercel.json carries only the daily catch-up run and the weekly waiver run.
# Live scoring needs to run every couple of minutes on game days, and the draft
# clock needs checking every minute while a draft is on — neither fits there,
# so they run from here instead. GitHub Actions is free for this.
#
# Set these repository secrets (Settings -> Secrets and variables -> Actions):
#   SITE_URL     https://your-app.vercel.app
#   CRON_SECRET  the same value as the Vercel environment variable
#
# Note that GitHub's scheduler is best-effort and can run several minutes late
# under load. If the draft clock matters to you, upgrade to Vercel Pro and move
# these back into vercel.json.

name: Scheduled jobs

on:
  schedule:
    # Live scoring, every five minutes on game days (Sun, Mon, Thu), UTC.
    - cron: "*/5 * * * 0,1,4"
    # The draft clock, every five minutes. A no-op unless a draft is running.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run now
        required: true
        default: scores
        type: choice
        options: [scores, autodraft, waivers, mail]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call the endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MANUAL: ${{ github.event.inputs.job }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL and CRON_SECRET must be set as repository secrets." >&2
            exit 1
          fi

          # A manual run does exactly what was asked for; a scheduled run does
          # both, and each endpoint is a no-op when there is nothing to do.
          if [ -n "$MANUAL" ]; then
            JOBS="$MANUAL"
          else
            # Mail rides along with the five-minute run rather than getting a
            # schedule of its own: a notice worth emailing is worth emailing
            # within five minutes, and the endpoint is a no-op with an empty
            # queue or no mail provider configured.
            JOBS="scores autodraft mail"
          fi

          FAILED=0
          for job in $JOBS; do
            echo "--- $job"
            CODE=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
              -H "authorization: Bearer $CRON_SECRET" \
              "$SITE_URL/api/cron/$job") || CODE=000
            echo "HTTP $CODE"
            cat /tmp/out.json 2>/dev/null || true
            echo
            # A 5xx is a real failure; anything else is the job reporting back.
            case "$CODE" in 5*|000) FAILED=1 ;; esac
          done
          exit $FAILED
